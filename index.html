<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess My Number</title>
<meta name="description" content="A number guessing game with three levels. Find the secret number before you run out of tries.">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="prop ring" aria-hidden="true"></div>
<div class="prop pencil" aria-hidden="true"></div>
<div class="prop sticky" aria-hidden="true">good luck :)</div>

<main class="page">
  <h1>Guess my number</h1>
  <p class="sub" id="sub"></p>
  <div class="levels" id="levels" role="group" aria-label="Level"></div>

  <div class="info">
    <div class="boxes" id="boxes" role="img"></div>
    <div id="best"></div>
  </div>

  <div class="big" id="big">
    <svg viewBox="0 0 170 90" aria-hidden="true"><path d="M14 46 C10 14, 120 2, 156 34 C168 64, 40 86, 16 56"/></svg>
    <span id="num">?</span>
  </div>

  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="range" id="range"></div>

  <div class="row">
    <input id="in" type="number" inputmode="numeric" min="1" step="1" placeholder="your guess" aria-label="Your guess" autocomplete="off">
    <button class="btn" id="go" type="button">Guess</button>
  </div>
  <button class="btn again" id="again" type="button">Go again</button>

  <div class="list" id="list"></div>
  <div class="foot" id="foot"></div>
</main>

<script src="script.js" defer></script>
</body>
</html>
