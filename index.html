<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guess my number('by Yatin')</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--wood1:#b88a5a;--wood2:#8e6339;--paper:#fbf8ef;--line:#cfd9e6;--margin:#e0a1a1;--ink:#1f3a73;--text:#3a3630;--muted:#8a8478;--red:#b3372f;--green:#2c6e49;--tape:rgba(255,233,150,.7);--sticky:#ffe98a;--ring:rgba(70,40,15,.25)}
@media (prefers-color-scheme:dark){:root{--wood1:#3b2a1d;--wood2:#241810;--paper:#2b3a33;--line:#36473f;--margin:#7a4a4a;--ink:#f1efe6;--text:#d8d6cc;--muted:#9aa69e;--red:#ff9b8f;--green:#a8e0b4;--tape:rgba(220,200,130,.35);--sticky:#c9b45a;--ring:rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html{min-height:100%;background-color:#8e6339;background-image:radial-gradient(ellipse at 20% 0%,rgba(255,236,190,.3),transparent 55%),radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.4) 100%),repeating-linear-gradient(92deg,rgba(0,0,0,.07) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(255,255,255,.06) 0 1px,transparent 1px 13px),linear-gradient(180deg,var(--wood1),var(--wood2));background-attachment:fixed}
body{margin:0;min-height:100vh;background:transparent;color:var(--text);font-family:"Caveat","Segoe Print","Bradley Hand",cursive;font-size:22px;display:flex;justify-content:center;padding:40px 14px}
.prop{position:fixed;pointer-events:none;z-index:0}
.ring{right:8%;bottom:10%;width:130px;height:130px;border-radius:50%;border:9px solid var(--ring);box-shadow:inset 0 0 8px var(--ring),0 0 5px var(--ring);transform:rotate(20deg) scaleY(.95)}
.pencil{left:6%;bottom:14%;width:240px;height:16px;background:linear-gradient(90deg,#d9605b 0 8%,#b9b9b9 8% 14%,#e8b23a 14% 80%,#f1d7a8 80% 90%,#333 90% 100%);clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));transform:rotate(-24deg)}
.sticky{right:6%;top:14%;width:150px;height:150px;padding:30px 14px 0;background:linear-gradient(160deg,var(--sticky),#e8b94a);color:#5b4a1a;font-size:34px;font-weight:700;line-height:1;text-align:center;box-shadow:0 10px 16px rgba(0,0,0,.35);transform:rotate(5deg)}
.page{position:relative;z-index:1;width:100%;max-width:440px;align-self:flex-start;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--line) 35px,var(--line) 36px);border-left:3px solid var(--margin);padding:26px 24px 28px 34px;box-shadow:0 2px 0 rgba(0,0,0,.1),0 18px 34px rgba(0,0,0,.4);transform:rotate(-.6deg);border-radius:3px}
.page::before{content:"";position:absolute;top:-14px;left:50%;width:110px;height:28px;margin-left:-55px;background:var(--tape);box-shadow:0 1px 3px rgba(0,0,0,.25);transform:rotate(-3deg)}
h1{margin:0;font-size:44px;line-height:1;color:var(--ink);font-weight:700;transform:rotate(-1deg)}
.sub{margin:6px 0 16px;color:var(--muted)}
.levels{display:flex;gap:18px;margin-bottom:14px}
.levels button{background:none;border:0;padding:0 2px;font:inherit;font-size:26px;color:var(--muted);cursor:pointer}
.levels button:hover{color:var(--ink)}
.levels button.on{color:var(--ink);font-weight:700;text-decoration:underline wavy var(--ink);text-underline-offset:5px}
.info{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.boxes{display:flex;gap:6px}
.box{width:18px;height:18px;border:2px solid var(--ink);border-radius:3px;position:relative;transform:rotate(-3deg)}
.box:nth-child(even){transform:rotate(3deg)}
.box.used::before{content:"×";position:absolute;inset:-9px 0 0 0;text-align:center;font-size:32px;line-height:36px;color:var(--red)}
.big{position:relative;width:170px;height:90px;margin:10px auto 4px;display:flex;align-items:center;justify-content:center;font-size:68px;font-weight:700;color:var(--ink)}
.big svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.big path{fill:none;stroke:var(--red);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420}
.big.circled path{animation:draw .8s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.msg{text-align:center;min-height:36px;font-size:28px;line-height:36px;color:var(--ink)}
.msg.good{color:var(--green)}.msg.bad{color:var(--red)}
.range{text-align:center;color:var(--muted);min-height:36px;line-height:36px}
.row{display:flex;gap:12px;align-items:flex-end;margin-top:4px}
input{flex:1;min-width:0;background:none;border:0;border-bottom:2px solid var(--ink);border-radius:0;outline:none;font:inherit;font-size:34px;color:var(--ink);text-align:center;padding:0 4px}
input::placeholder{color:var(--muted);opacity:.7}input:disabled{opacity:.5}
.btn{font:inherit;font-size:26px;font-weight:700;color:var(--paper);background:var(--ink);border:0;border-radius:6px;padding:2px 16px 4px;cursor:pointer;transform:rotate(1.5deg);transition:transform .1s}
.btn:hover{transform:rotate(0) scale(1.04)}.btn:active{transform:scale(.94)}
.btn:disabled{opacity:.4;cursor:default;transform:rotate(1.5deg)}
.again{display:none;margin:14px auto 0}
.list{margin-top:12px;display:flex;flex-wrap:wrap;gap:2px 16px;min-height:36px}
.g{line-height:36px;color:var(--muted);animation:in .25s ease-out}
.g b{color:var(--ink);font-weight:700}.g.win b{color:var(--green)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.foot{margin-top:8px;text-align:right;color:var(--muted);font-size:20px}
@media (min-width:1000px){body{align-items:center;font-size:26px}.page{max-width:560px;align-self:center;padding:34px 34px 36px 46px}h1{font-size:54px}.big{width:210px;height:110px;font-size:84px}.msg{font-size:32px}input{font-size:40px}}
@media (max-width:760px){.prop{display:none}}
</style></head>
<body>
<div class="prop ring"></div><div class="prop pencil"></div><div class="prop sticky">good luck :)</div>
<div class="page">
<h1>Guess my number</h1><p class="sub" id="sub"></p>
<div class="levels" id="levels"></div>
<div class="info"><div class="boxes" id="boxes"></div><div id="best"></div></div>
<div class="big" id="big"><svg viewBox="0 0 170 90"><path d="M14 46 C10 14, 120 2, 156 34 C168 64, 40 86, 16 56"/></svg><span id="num">?</span></div>
<div class="msg" id="msg"></div><div class="range" id="range"></div>
<div class="row"><input id="in" type="number" inputmode="numeric" placeholder="your guess" autocomplete="off"><button class="btn" id="go">Guess</button></div>
<button class="btn again" id="again">Go again</button>
<div class="list" id="list"></div><div class="foot" id="foot"></div>
</div>
<script>
var LEVELS={Easy:{max:50,tries:10},Medium:{max:100,tries:7},Hard:{max:500,tries:9}};
var level="Medium",secret,left,over,lo,hi,tried,wins=0;
function $(id){return document.getElementById(id)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function getBest(){try{return JSON.parse(localStorage.getItem("guess-best")||"{}")}catch(e){return{}}}
function saveBest(o){try{localStorage.setItem("guess-best",JSON.stringify(o))}catch(e){}}
function heat(n){var d=Math.abs(n-secret)/LEVELS[level].max;if(d<.03)return"Super close!";if(d<.08)return"Really close.";if(d<.18)return"Getting warm.";if(d<.35)return"Still pretty far.";return"Ice cold."}
function drawLevels(){$("levels").innerHTML="";Object.keys(LEVELS).forEach(function(n){var b=document.createElement("button");b.textContent=n;if(n===level)b.className="on";b.onclick=function(){level=n;start()};$("levels").appendChild(b)})}
function drawBoxes(){var t=LEVELS[level].tries;$("boxes").innerHTML="";for(var i=0;i<t;i++){var s=document.createElement("span");s.className="box"+(i<t-left?" used":"");$("boxes").appendChild(s)}}
function drawInfo(){var b=getBest()[level];$("best").textContent=b?"best: "+b:"";$("range").textContent=over?"":"It’s between "+lo+" and "+hi+".";$("foot").textContent=wins?"wins this session: "+wins:""}
function say(t,c){$("msg").textContent=t;$("msg").className="msg "+(c||"")}
function start(){var L=LEVELS[level];secret=Math.floor(Math.random()*L.max)+1;left=L.tries;over=false;lo=1;hi=L.max;tried=[];$("sub").textContent="I’m thinking of something from 1 to "+L.max+".";$("num").textContent="?";$("big").className="big";$("list").innerHTML="";$("in").value="";$("in").disabled=false;$("go").disabled=false;$("again").style.display="none";say("Go on, take a shot.");drawLevels();drawBoxes();drawInfo();$("in").focus()}
function finish(){over=true;$("in").disabled=true;$("go").disabled=true;$("again").style.display="block";$("num").textContent=secret;drawInfo()}
function addGuess(n,note,win){var d=document.createElement("div");d.className="g"+(win?" win":"");d.innerHTML="<b>"+n+"</b> "+note;$("list").appendChild(d)}
function guess(){if(over)return;var L=LEVELS[level],n=parseInt($("in").value,10);
if(isNaN(n)||n<1||n>L.max){say("Pick a number from 1 to "+L.max+".","bad");return}
if(tried.indexOf(n)!==-1){say("You already tried "+n+"!","bad");return}
tried.push(n);left--;$("in").value="";
if(n===secret){var used=L.tries-left;wins++;var best=getBest();if(!best[level]||used<best[level]){best[level]=used;saveBest(best)}
if(used===1)say("First try?! Suspicious.","good");else if(used<=3)say("Nice, only "+used+" tries!","good");else say("Got it! Took "+used+" tries.","good");
addGuess(n,"yes!",true);$("big").className="big circled";finish()}
else{var high=n>secret;if(high)hi=Math.min(hi,n-1);else lo=Math.max(lo,n+1);addGuess(n,high?"too high":"too low");
if(left===0){say("Out of tries. It was "+secret+".","bad");finish()}
else{var dir=high?pick(["Too high.","Nope, lower.","Go lower than that."]):pick(["Too low.","Nope, higher.","Go higher than that."]);say(dir+" "+heat(n),"bad")}}
drawBoxes();drawInfo();if(!over)$("in").focus()}
$("go").onclick=guess;$("again").onclick=start;
$("in").addEventListener("keydown",function(e){if(e.key==="Enter")guess()});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&over)start()});
start();
</script></body>
</html>
